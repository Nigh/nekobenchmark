name: Export and release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset: nekobenchmark-linux-x64.zip
            preset: Linux
          - name: Windows x64
            os: windows-latest
            asset: nekobenchmark-windows-x64.zip
            preset: Windows
          - name: macOS x64
            os: macos-26-intel
            asset: nekobenchmark-macos-x64.zip
            preset: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and verify project
        shell: bash
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script tests/reaction_state_test.gd
          godot --headless --path . --script tests/sequence_state_test.gd
          godot --headless --path . --script tests/playthrough_test.gd
          godot --headless --path . --script tests/history_tracking_test.gd
      - name: Export project
        shell: bash
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "${{ matrix.preset }}"
      - name: Package export
        shell: bash
        run: |
          mkdir -p package
          cp dist/* package/
          cp assets/MapleMono-OFL.txt package/
          cp assets/licenses/xianii-theme-LICENSE.txt package/
          (cd package && python3 -m zipfile -c "../dist/${{ matrix.asset }}" *)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nekobenchmark-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create --repo "$GH_REPO" "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Automated cross-platform binaries for commit ${GITHUB_SHA}."
